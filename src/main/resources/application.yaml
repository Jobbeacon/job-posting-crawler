server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${PROFILE_ACTIVE:local}

  application:
    name: job-posting-crawler

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.xml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_crawler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

playwright:
  headless: ${PLAYWRIGHT_HEADLESS:false}

crawler:
  extractor:
    html:
      domains:
        itviec_com:
          title: "//div[@class='job-header-info']/h1"
          company-name: "//div[@class='employer-name']"
          company-logo-url: "//img[contains(@class, 'employer-logo')]/@src"
          description: "//section[contains(@class, 'job-content')]"
          location: "//*[local-name()='svg'][*[local-name()='use' and contains(@href,'#map-pin')]]/following-sibling::span[contains(@class,'text-rich-grey')][1]"
          industry: "//div[normalize-space(.)='Job Domain:']/following-sibling::div[1]"
          skills: "//div[normalize-space(.)='Skills:']/following-sibling::div[1]"
  scheduler:
    enabled: true
    seed-interval: 30m

  worker:
    enabled: true
    pool-size: ${CRAWLER_WORKER_POOL_SIZE:1}
    idle-interval: 5s
    max-depth: ${CRAWLER_MAX_DEPTH:5}

  dedup:
    non-job-dedup-ttl: 7d
    job-bloom-filter-name: ${JOB_URL_BLOOM_FILTER_NAME}

  rabbitmq:
    exchange: job-posting
    queue: job-posting.parsed
    routing-key: job-posting.parsed

  sources:
    - name: TOPCV
      enabled: true
      delay: 30s
      job-page-url-prefix: https://www.topcv.vn/viec-lam/
      seeds:
        - https://www.topcv.vn/viec-lam

    - name: ITVIEC
      enabled: true
      delay: 30s
      job-page-url-prefix: https://itviec.com/it-jobs/
      seeds:
        - https://itviec.com/it-jobs
